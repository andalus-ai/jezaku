quarkus.http.root-path=/
quarkus.http.port=8114
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id,x-jezaku-ops-token,x-jezaku-ops-actor
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Messaging API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Direct, group, and spatial context messaging for events, places, journeys, and memories.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common
jezaku.messaging.notifications.intake-url=
jezaku.messaging.ops-token=
jezaku.messaging.pipeline.health.max-pending-backlog=1000
jezaku.messaging.pipeline.health.max-failed-events=100
jezaku.messaging.pipeline.auto-drain.enabled=false
jezaku.messaging.pipeline.auto-drain.interval-millis=1000
jezaku.messaging.pipeline.auto-drain.batch-size=25
jezaku.messaging.ops.audit.max-events=200
