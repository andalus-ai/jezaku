quarkus.http.root-path=/
quarkus.http.port=8110
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Safety API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Reports, moderation review queues, guardian safety zones, and location policy checks.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common

%dev.jezaku.auth.jwt-secret=dev-only-insecure-secret-change-me-0123456789
%test.jezaku.auth.jwt-secret=test-only-insecure-secret-0123456789abcdef

# Spatial policy persistence (PostgreSQL). Credentials and URL are supplied by deployment.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${JEZAKU_DB_USERNAME:jezaku}
quarkus.datasource.password=${JEZAKU_DB_PASSWORD:jezaku}
quarkus.datasource.jdbc.url=${JEZAKU_DB_URL:jdbc:postgresql://localhost:5432/jezaku}
quarkus.flyway.locations=db/migration
%prod.quarkus.flyway.migrate-at-start=true
%dev.quarkus.datasource.active=false
%dev.quarkus.flyway.migrate-at-start=false
%test.quarkus.datasource.active=false
%test.quarkus.flyway.migrate-at-start=false
