quarkus.http.root-path=/
quarkus.http.port=8109
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Presence API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Ephemeral location presence, heading telemetry, nearby users, and live minimap dots.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common
jezaku.presence.audience-access.source=local
jezaku.presence.audience-access.request-timeout-seconds=3
jezaku.presence.audience-access.fallback-to-local=true
%dev.jezaku.auth.jwt-secret=dev-only-insecure-secret-change-me-0123456789
%test.jezaku.auth.jwt-secret=test-only-insecure-secret-0123456789abcdef
