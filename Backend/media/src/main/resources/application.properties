quarkus.http.root-path=/
quarkus.http.port=8108
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Media API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Upload slots, media completion, moderation, lifecycle events, worker-offloaded checkpointed memory snapshot sync projection/status health/attention/prioritized status list headline summaries/operator ops view/recommended run/bounded single-flight dispatch drain with optional runtime scheduler/structured failure results/duration/slow-health-aware dispatch and run history summaries/active-run correlation and timeout/failure telemetry/enforced backoff/single-flight retry/run history, user media inventory, and compact media references.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common
jezaku.media.storage.upload-base-url=https://upload.jezaku.local/uploads
jezaku.media.storage.media-base-url=https://cdn.jezaku.local/media
jezaku.media.storage.dev-token-prefix=dev-
jezaku.media.memory-sync.request-timeout-seconds=5
jezaku.media.memory-sync.dispatch.scheduler.enabled=false
jezaku.media.memory-sync.dispatch.scheduler.interval-seconds=30
jezaku.media.memory-sync.dispatch.scheduler.max-runs=1
jezaku.media.memory-sync.dispatch.scheduler.limit=50
