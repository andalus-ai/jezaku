group 'com.arengine.ar_engine'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.arengine.ar_engine'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24   // ARCore requires API 24+
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // ARCore SDK
    implementation 'com.google.ar:core:1.44.0'

    // Lifecycle (for observer pattern)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Flutter supplies the correct embedding artifact for debug/profile/release
    // when this package is built as a Flutter plugin.
}
