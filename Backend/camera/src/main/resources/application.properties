quarkus.http.root-path=/
quarkus.http.port=8116
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Camera Context API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Camera HUD context, normalized telemetry, AR anchor confidence, and layered minimap overlays.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common
jezaku.camera.memory-overlay.source=seed
jezaku.camera.memory-overlay.request-timeout-seconds=3
jezaku.camera.memory-overlay.fallback-to-seed=true
jezaku.camera.presence.source=seed
jezaku.camera.presence.request-timeout-seconds=3
jezaku.camera.presence.fallback-to-seed=true
jezaku.camera.memory-visibility.source=local
jezaku.camera.memory-visibility.scope=public
jezaku.camera.memory-visibility.target-id=camera_memory_overlay
jezaku.camera.memory-visibility.request-timeout-seconds=3
jezaku.camera.memory-visibility.fallback-to-local=true
