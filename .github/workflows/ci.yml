name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-packages:
    name: Flutter package (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ar_engine, ar_engine_testkit, ar_model_cache, jezaku_ar]
    defaults:
      run:
        working-directory: UI/Packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
        if: ${{ !cancelled() }}

  flutter-app:
    name: Flutter app
    runs-on: ubuntu-latest
    env:
      # Several tests assert local-time labels (e.g. "Reviewed 18:05") written
      # in Jakarta time.
      TZ: Asia/Jakarta
    defaults:
      run:
        working-directory: UI/jezaku
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
        if: ${{ !cancelled() }}

  rust-ar-core:
    name: Rust ar-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/ar-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  backend-java:
    name: Backend (Quarkus services)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test all services
        run: mvn -B -ntp -fae verify
