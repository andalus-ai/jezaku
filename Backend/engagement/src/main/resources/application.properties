quarkus.http.root-path=/
quarkus.http.port=8111
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Engagement API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Reactions, comments, bookmarks, and engagement summaries across spatial content.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common
%dev.jezaku.auth.jwt-secret=dev-only-insecure-secret-change-me-0123456789
%test.jezaku.auth.jwt-secret=test-only-insecure-secret-0123456789abcdef

# Friends-only comments on photo frames (memories). Off by default, like jezaku.auth.required; production turns it on
# and points at the memory and social services (calls carry this service's token, see jezaku.auth.service-*).
jezaku.engagement.frame-comments.enforced=false
%dev.jezaku.engagement.memory-base-url=http://localhost:8104
%dev.jezaku.engagement.social-base-url=http://localhost:8103
jezaku.auth.service-name=engagement
jezaku.auth.service-scopes=memory:read,social:audience
%dev.jezaku.auth.service-secret=dev-only-insecure-service-secret-change-me-0123456789
