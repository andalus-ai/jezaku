quarkus.http.root-path=/
quarkus.http.port=8107
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Notifications API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Notification inbox, preferences, delivery channels, and registered devices.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common

# Shared with the identity service so access tokens can be verified here. Production sets JEZAKU_AUTH_JWT_SECRET;
# the values below are for local development and tests only. Authentication is not enforced in this service yet
# (producer endpoints are called by other services), but a verified token restricts inbox/device access to its owner.
%dev.jezaku.auth.jwt-secret=dev-only-insecure-secret-change-me-0123456789
%test.jezaku.auth.jwt-secret=test-only-insecure-secret-0123456789abcdef
