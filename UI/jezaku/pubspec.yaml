name: jejaku
description: AR Geotagged Photo Platform with Precise Positioning
version: 1.0.0+1
publish_to: none  

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  ar_engine:
    path: ../Packages/ar_engine
  ar_model_cache:
    path: ../Packages/ar_model_cache
  jezaku_ar:
    path: ../Packages/jezaku_ar

  # State Management
  flutter_riverpod: ^3.0.3
  
  # Location & Sensors (High-precision)
  geolocator: ^11.0.0           # GPS with best accuracy
  flutter_compass: ^0.8.0       # Magnetic heading
  sensors_plus: ^4.0.2          # Accelerometer, gyroscope
  vector_math: ^2.1.4           # Quaternion calculations
  
  # Camera & Image
  camera: ^0.10.5+5
  image: ^4.1.3
  exif: ^3.3.0
  
  # Networking
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  
  # Permissions
  permission_handler: ^11.1.0
  
  # UI
  google_maps_flutter: ^2.5.0
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  ar_engine_testkit:
    path: ../Packages/ar_engine_testkit
  flutter_lints: ^3.0.1




flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/jezaku-logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/jezaku-logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icons/jezaku-logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/jezaku-logo.png"

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true


  assets:
  - assets/icons/
  - pubspec.yaml
