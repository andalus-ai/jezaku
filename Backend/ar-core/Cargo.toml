[workspace]
resolver = "2"
members = ["crates/ar-core", "crates/ar-geo", "crates/ar-fusion", "crates/ar-planes", "crates/ar-vo", "crates/ar-service", "crates/ar-replay"]

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
nalgebra = { version = "0.32", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
base64 = "0.22"
