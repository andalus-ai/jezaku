quarkus.http.root-path=/
quarkus.http.port=8105
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Spatial Trails Places API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=AR anchors, trail history, saved trails, and place discovery.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common

# Read policy invalidation events and assess route alternatives through the central Safety service.
jezaku.auth.service-name=spatial-trails-places
jezaku.auth.service-scopes=spatial:policy-evaluate,spatial:policy-changes-read

%dev.jezaku.auth.jwt-secret=dev-only-insecure-secret-change-me-0123456789
%test.jezaku.auth.jwt-secret=test-only-insecure-secret-0123456789abcdef

# Spatial policy is authoritative in production; isolated dev/test runs opt out explicitly.
jezaku.spatial.safety.enforced=${JEZAKU_SPATIAL_SAFETY_ENFORCED:true}
jezaku.spatial.safety.base-url=${JEZAKU_SAFETY_BASE_URL:}
jezaku.spatial.request-timeout-seconds=${JEZAKU_SPATIAL_SAFETY_TIMEOUT_SECONDS:3}
%dev.jezaku.spatial.safety.enforced=false
%test.jezaku.spatial.safety.enforced=false
