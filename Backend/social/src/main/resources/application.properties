quarkus.http.root-path=/
quarkus.http.port=8103
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Social API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Friend requests, family links, groups, communities, recommendations, blocks, and visibility decisions.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common
jezaku.social.graph.repository=memory
jezaku.social.seed.enabled=true
# Sample graph seed data is memory-only by default. Enable this only for local Neo4j smoke tests.
# jezaku.social.seed.neo4j.enabled=true
# Set jezaku.social.graph.repository=neo4j to use the Bolt-backed graph repository.
# jezaku.social.neo4j.uri=bolt://localhost:7687
# jezaku.social.neo4j.username=neo4j
# jezaku.social.neo4j.password=change-me
# jezaku.social.neo4j.database=neo4j
# jezaku.social.neo4j.apply-schema=false
