quarkus.http.root-path=/
quarkus.http.port=8104
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Memory API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Camera memories, explainable AR anchor confidence, minimap dots with summary/perimeter/sector clusters, user feeds, geospatial metadata, and idempotent media snapshot sync.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common
%dev.jezaku.auth.jwt-secret=dev-only-insecure-secret-change-me-0123456789
%test.jezaku.auth.jwt-secret=test-only-insecure-secret-0123456789abcdef
%dev.jezaku.auth.service-secret=dev-only-insecure-service-secret-change-me-0123456789
%test.jezaku.auth.service-secret=test-only-insecure-service-secret-0123456789abcd

# Friends-only memories shown to the owner's friends. Off by default, like jezaku.auth.required: while off,
# friends-only memories are visible to their owner alone. Production turns it on and points at the social service
# (calls carry this service's token, see jezaku.auth.service-*). If the social service cannot be reached, friends-only
# memories stay hidden.
jezaku.memory.friends-visibility.enforced=false
%dev.jezaku.memory.social-base-url=http://localhost:8103
jezaku.auth.service-name=memory
jezaku.auth.service-scopes=social:audience
%dev.jezaku.auth.service-secret=dev-only-insecure-service-secret-change-me-0123456789

# Other people's memories are read only on site: within this radius of the position the caller reports. Off by
# default, like jezaku.auth.required (dev, test and offline demos); production turns it on. The owner always reads
# their own memories from anywhere. See the memory README.
jezaku.memory.on-site-view.enforced=false
jezaku.memory.on-site-view.radius-meters=20
