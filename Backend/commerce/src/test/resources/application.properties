# Repository integration tests use an ephemeral PostgreSQL instance.
# Leave the JDBC URL unset in the test profile so Quarkus Dev Services can
# provision PostgreSQL on CI and on developer machines with Docker available.
%test.quarkus.datasource.jdbc.url=
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true
