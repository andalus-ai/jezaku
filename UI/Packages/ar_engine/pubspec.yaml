name: ar_engine
description: >
  A production-grade multi-platform Augmented Reality plugin for Flutter.
  Backed by ARCore (Android), ARKit/Metal (iOS), WebXR Device API (Web),
  and a webcam + visual-odometry software renderer (Desktop).
version: 0.4.0
homepage: https://github.com/yourorg/ar_engine
repository: https://github.com/yourorg/ar_engine
issue_tracker: https://github.com/yourorg/ar_engine/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.arengine.ar_engine
        pluginClass: ArEnginePlugin
        minSdkVersion: 24
      ios:
        pluginClass: ArEnginePlugin
        minIosVersion: "14.0"
      web:
        pluginClass: ArEngineWebPlugin
        fileName: ar_engine_web.dart
      macos:
        pluginClass: ArEnginePlugin
        minMacOsVersion: "10.15"
      windows:
        pluginClass: ArEnginePluginCApi

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8
  collection: ^1.18.0
  meta: ^1.12.0
  # Mime type for snapshot/recording
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
