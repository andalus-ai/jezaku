quarkus.http.root-path=/
quarkus.http.port=8101
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.smallrye-openapi.info-title=Jezaku Identity API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Accounts, sessions, guardian links, and trusted device contracts.
quarkus.swagger-ui.always-include=true
quarkus.index-dependency.jezaku-common.group-id=tech.kayys.jezaku
quarkus.index-dependency.jezaku-common.artifact-id=common

# --- Authentication -------------------------------------------------------------------------------------------
# Access tokens are HS256 JWTs signed with this shared secret (>= 32 bytes). Every service that sets
# jezaku.auth.required=true must use the same value as identity. Production supplies it through the
# JEZAKU_AUTH_JWT_SECRET environment variable; the values below are for local development and tests only.
%dev.jezaku.auth.jwt-secret=dev-only-insecure-secret-change-me-0123456789
%test.jezaku.auth.jwt-secret=test-only-insecure-secret-0123456789abcdef
# Anonymous requests are tolerated in dev/test so existing clients keep working; production enforces tokens.
%prod.jezaku.auth.required=true
# Seeded demo accounts (known password) exist only outside production.
%prod.jezaku.identity.seed.enabled=false
